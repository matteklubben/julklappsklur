<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gipslådans Hemlighet – Film</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f3d778;
      --bg-dark: #0d0408;
      --text-main: #f3e9e7;
      --text-muted: #cbb8b4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at top, #240c16 0%, #0a0306 80%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 540px;
      padding: 18px 16px;
      margin: 0 auto;
    }
    .card {
      background: linear-gradient(180deg, #1c0a12 0%, #110509 100%);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 20px;
      padding: 20px 18px;
      text-align: center;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.8);
    }
    .eyebrow {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 1.4rem;
      color: var(--gold-light);
    }
    .video-frame {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid rgba(212, 175, 55, 0.55);
      background: #000;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.7);
      margin-bottom: 16px;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
      max-height: 65dvh;
      background: #000;
    }
    .tap-to-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 3, 6, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .tap-to-play-pill {
      padding: 12px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, #e2be4b 0%, #b88e1e 100%);
      color: #16070c;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }
    .next-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #e2be4b 0%, #b88e1e 100%);
      color: #16070c;
      font-size: 0.98rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.28);
      transition: transform 0.15s ease;
    }
    .next-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="eyebrow">Gipslådans försegling</div>
      <h1>Mästarens sista prövning</h1>

      <div class="video-frame">
        <video id="gipsVideo" src="gips.mp4" playsinline controls preload="auto"></video>
        <div id="tapOverlay" class="tap-to-play-overlay" onclick="startVideoManually()">
          <div class="tap-to-play-pill">▶ Tryck för att starta filmen</div>
        </div>
      </div>

      <a href="gips-skrap.html" class="next-btn">
        <span>Gå vidare till sista kluret</span>
        <span>→</span>
      </a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    try { if (typeof saveProgress === "function") saveProgress("gips-film.html", 3); } catch (e) {}

    const video = document.getElementById("gipsVideo");
    const overlay = document.getElementById("tapOverlay");

    function startVideoManually() {
      overlay.style.display = "none";
      video.muted = false;
      video.play().catch(() => {});
    }

    window.addEventListener("DOMContentLoaded", () => {
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          overlay.style.display = "flex";
        });
      }
    });
  </script>
</body>
</html>
