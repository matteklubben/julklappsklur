<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gipslådan</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f3d778;
      --bg-dark: #0d0408;
      --text-main: #f3e9e7;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at top, #240c16 0%, #0d0408 75%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 440px;
      padding: 18px 16px;
      margin: 0 auto;
    }
    .card {
      background: linear-gradient(180deg, #1d0b13 0%, #12050a 100%);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 20px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.78);
    }

    /* Skrapplattan */
    .plaster-slab {
      position: relative;
      width: 100%;
      height: 190px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(212, 175, 55, 0.6);
      background: radial-gradient(circle at center, #241018 0%, #110509 100%);
      box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.9);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* Stora bokstäver med luftigt mellanrum inunder gipset */
    .secret-word-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 0 14px;
      pointer-events: none;
    }
    .secret-letter {
      font-size: clamp(2.2rem, 9vw, 3rem);
      font-weight: 900;
      color: var(--gold-light);
      text-shadow: 0 2px 12px rgba(212, 175, 55, 0.45);
      letter-spacing: 0.04em;
    }

    canvas#plasterCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="plaster-slab" id="plasterSlab">
        <div class="secret-word-layer" id="secretWordLayer"></div>
        <canvas id="plasterCanvas"></canvas>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    try { if (typeof saveProgress === "function") saveProgress("gips-skrap.html", 3); } catch (e) {}

    // Hämta ordet från config.js (fallback till "GIPSET" om config.js saknas)
    const rawWord = (typeof VAULT_CONFIG !== "undefined" && VAULT_CONFIG.gipsWord)
      ? String(VAULT_CONFIG.gipsWord)
      : "GIPSET";

    const SECRET_WORD = rawWord.toUpperCase().replace(/[^A-ZÅÄÖ]/g, "") || "GIPSET";

    // Rendera de stora bokstäverna med luftigt mellanrum under gipset
    const wordLayer = document.getElementById("secretWordLayer");
    SECRET_WORD.split("").forEach(letter => {
      const span = document.createElement("span");
      span.className = "secret-letter";
      span.textContent = letter;
      wordLayer.appendChild(span);
    });

    // =========================================================
    // GIPS-SKRAPYTA (CANVAS)
    // =========================================================
    const slab = document.getElementById("plasterSlab");
    const canvas = document.getElementById("plasterCanvas");
    const ctx = canvas.getContext("2d");
    let isDrawing = false;
    let lastPoint = null;

    function initPlasterCanvas() {
      const rect = slab.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;

      // Baslager av torkat gips
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, "#d8d1c7");
      grad.addColorStop(0.5, "#c5bdb2");
      grad.addColorStop(1, "#b4aba0");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Kornig gipsstruktur
      for (let i = 0; i < 2400; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const size = Math.random() * 2.2 + 0.5;
        ctx.fillStyle = i % 2 === 0 ? "rgba(255,255,255,0.22)" : "rgba(75,68,60,0.16)";
        ctx.fillRect(x, y, size, size);
      }

      // Tunna sprickor i gipsytan
      ctx.strokeStyle = "rgba(85, 78, 70, 0.28)";
      ctx.lineWidth = 1;
      for (let c = 0; c < 6; c++) {
        ctx.beginPath();
        let cx = Math.random() * w;
        let cy = Math.random() * h;
        ctx.moveTo(cx, cy);
        for (let s = 0; s < 5; s++) {
          cx += (Math.random() - 0.5) * 45;
          cy += (Math.random() - 0.5) * 35;
          ctx.lineTo(cx, cy);
        }
        ctx.stroke();
      }
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function scratchTo(pt) {
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 28;

      ctx.beginPath();
      if (lastPoint) {
        ctx.moveTo(lastPoint.x, lastPoint.y);
      } else {
        ctx.moveTo(pt.x, pt.y);
      }
      ctx.lineTo(pt.x, pt.y);
      ctx.stroke();
      ctx.restore();
      lastPoint = pt;
    }

    canvas.addEventListener("pointerdown", e => {
      isDrawing = true;
      canvas.setPointerCapture(e.pointerId);
      lastPoint = getPos(e);
      scratchTo(lastPoint);
    });

    canvas.addEventListener("pointermove", e => {
      if (!isDrawing) return;
      scratchTo(getPos(e));
    });

    function stopScratch(e) {
      isDrawing = false;
      lastPoint = null;
      if (e && canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }

    canvas.addEventListener("pointerup", stopScratch);
    canvas.addEventListener("pointercancel", stopScratch);

    window.addEventListener("DOMContentLoaded", initPlasterCanvas);
  </script>
</body>
</html>
